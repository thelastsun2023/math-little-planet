<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf6ee"><title>口算小星球 · 每天进步一点点</title><link rel="stylesheet" href="style.css?v=reset3"><script src="app.js?v=reset3" defer></script></head>
<body><main class="app">
<header><div class="brand"><span class="logo">✦</span><div><h1>口算小星球</h1><p>每天 20 题，进步一点点</p></div></div><span class="badge">离线也能练</span></header>
<section class="modes" aria-label="选择练习模式"><button data-mode="10-add"><small>初级 · 加法</small>10 以内加法<span>＋</span></button><button data-mode="10-sub"><small>初级 · 减法</small>10 以内减法<span>−</span></button><button data-mode="100-add"><small>进阶 · 加法</small>100 以内加法<span>＋</span></button><button data-mode="100-sub"><small>进阶 · 减法</small>100 以内减法<span>−</span></button><button data-mode="20-sub">20 以内减法</button><button data-mode="10-mul">10 以内乘法</button><button data-mode="100-div">100 以内除法</button></section>
<div class="voice-controls"><label for="voice-language">朗读语言</label><select id="voice-language"><option value="zh-CN">中文语音</option><option value="en-US">English</option><option value="off">静音</option></select><button id="read-question">♪ 重读题目</button><span id="voice-note" aria-live="polite"></span></div>
<section class="console" id="practice"><div class="status"><span id="mode-label">准备好出发了吗？</span><span id="counter">20 题小挑战</span></div><div class="timing"><span id="question-time">本题 0.0 秒</span><span id="total-time">总计 0.0 秒</span></div><div class="progress"><div id="progress-fill"></div></div>
<button class="screen" id="screen" aria-label="答题显示屏，判分后点击进入下一题"><span class="screen-top"><span>✦ MATH EXPLORER</span><span id="screen-state">READY</span></span><span id="equation">你好，小星星！</span><span id="input">选择上方模式开始</span><span id="feedback" aria-live="polite">一起开启今天的口算之旅</span><span id="next-hint">每次练习 20 题</span></button>
<div class="keypad" aria-label="答题键盘"><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="+" class="operator">＋</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="−" class="operator">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="×" class="operator">×</button><button data-key="clear" class="utility">清除</button><button data-key="0">0</button><button data-key="back" class="utility" aria-label="退格">⌫</button><button data-key="÷" class="operator">÷</button><button data-key="answer" class="answer">答案 <span>看一看</span></button><button data-key="=" class="submit">＝ <span>确认答案</span></button></div><p class="tip">输入答案 → 按 ＝ 核对 → 点击显示屏继续</p></section>
<section id="results" class="results" hidden><div class="medal">★</div><p class="eyebrow">挑战完成</p><h2>又迈出了一小步！</h2><p id="result-message"></p><div class="stats"><div><strong id="correct-count"></strong><span>正确题数</span></div><div><strong id="wrong-count"></strong><span>错误题数</span></div><div><strong id="correct-rate"></strong><span>正确率</span></div><div><strong id="wrong-rate"></strong><span>错误率</span></div></div><div class="time-summary"><p>答题用时 <strong id="answer-total"></strong></p><p>整轮总时间 <strong id="round-total"></strong></p><p>平均每题 <strong id="average-time"></strong></p><small>答题用时：出题至判分；总时间包含语音与等待。</small></div><details><summary>查看每题用时</summary><table><thead><tr><th>题号</th><th>算式</th><th>结果</th><th>用时</th></tr></thead><tbody id="time-details"></tbody></table></details><button id="restart" class="primary">再练 20 题</button><button id="choose" class="secondary">选择其他模式</button></section>
<button id="reset-page" class="reset-page">↻ 复位</button><footer>小小练习，大大进步 ✦</footer></main></body></html>
